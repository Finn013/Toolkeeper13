<meta name="theme-color" content="#2f62c4">
<style>
:root{
  --bg1:#eef2f8; --bg2:#dee7f2;
  --surface:#ffffff; --surface-2:#f5f7fb;
  --ink:#1c2530; --ink-muted:#65728a; --ink-faint:#98a2b3;
  --line:#e2e7f0;
  --accent:#3b6dd8; --accent-ink:#ffffff; --accent-soft:#e8effc;
  --ok:#1f9d63; --ok-soft:#e4f7ec;
  --warn:#c8790b; --warn-soft:#fdf1de;
  --danger:#d33a3a; --danger-soft:#fbe7e7;
  --radius:14px; --radius-sm:9px;
  --shadow:0 8px 28px rgba(30,41,66,.10);
  --glass:rgba(255,255,255,.68);
  --tap:44px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; min-height:100dvh;
  background:
    radial-gradient(1200px 600px at 100% -10%, #f4f8ff 0%, transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important;}
button{font:inherit;}
input,select,textarea{font:inherit;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid transparent; border-radius:var(--radius-sm);
  padding:0 14px; height:var(--tap); min-width:var(--tap);
  background:var(--surface); color:var(--ink); font-weight:600; font-size:14px;
  cursor:pointer; touch-action:manipulation; white-space:nowrap;
  transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  box-shadow:0 1px 2px rgba(20,30,50,.06);
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-ok{background:var(--ok); color:#fff;}
.btn-warn{background:var(--warn); color:#fff;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-outline{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-ghost{background:transparent; box-shadow:none; color:var(--ink-muted);}
.btn-sm{height:34px; padding:0 10px; font-size:13px;}
.btn-icon{width:var(--tap); padding:0; flex:none;}
.btn[disabled]{opacity:.4; cursor:not-allowed;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--danger); display:none;}
.dot.show{display:inline-block;}

/* ---------- Layout shells ---------- */
#app{min-height:100dvh; display:flex; flex-direction:column;}
.welcome{
  flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
}
.welcome-card{
  max-width:420px; width:100%; background:var(--glass); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.6); border-radius:20px; padding:28px 24px;
  box-shadow:var(--shadow); text-align:center;
}
.welcome-card h1{font-size:19px; margin:0 0 6px;}
.welcome-card p{color:var(--ink-muted); font-size:13.5px; line-height:1.5; margin:0 0 20px;}
.welcome-actions{display:flex; flex-direction:column; gap:10px;}
.welcome-actions .btn{height:48px; font-size:15px;}
.draft-banner{
  margin-top:16px; padding:12px; border-radius:var(--radius-sm);
  background:var(--warn-soft); color:#7a4d09; font-size:13px; text-align:left;
}
.draft-banner .row{display:flex; gap:8px; margin-top:8px;}

.storageToggle{display:flex; gap:8px; margin-bottom:6px;}
.stOption{
  flex:1; height:40px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-muted); font-weight:600; font-size:13px; cursor:pointer;
}
.stOption.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.stOption[disabled]{opacity:.4; cursor:not-allowed;}
.stGear{
  flex:none; width:40px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--surface-2); cursor:pointer; font-size:15px;
}
.cloudWarn{font-size:11.5px; color:var(--warn); text-align:left; margin:0 0 14px;}

.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; background:var(--glass); backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.6);
}
.topbar .spacer{flex:1;}
.brand{font-weight:700; font-size:15px; margin-right:6px; white-space:nowrap;}
.editSwitch{
  display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-muted);
  padding:0 10px; height:var(--tap); border-radius:var(--radius-sm); background:var(--surface-2);
}
.switch{
  width:38px; height:22px; border-radius:20px; background:#c9d2e2; position:relative; cursor:pointer; flex:none;
  transition:background .15s;
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;
}
.switch.on{background:var(--accent);}
.switch.on::after{left:18px;}

.counters{
  display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px 0;
}
.counter{
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:6px 12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;
}
.counter b{font-weight:700;}
.c-stock{color:var(--ok);} .c-issued{color:var(--warn);} .c-repair{color:var(--danger);}

.searchbar{padding:10px 14px 0;}
.searchbar input{
  width:100%; height:40px; border-radius:999px; border:1px solid var(--line);
  padding:0 16px; background:var(--surface); color:var(--ink);
}
.searchbar input::placeholder{color:var(--ink-faint);}

.content{
  flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px;
  padding:14px; align-items:start;
}
.panel{
  background:var(--surface); border-radius:var(--radius); border:1px solid var(--line);
  overflow:hidden; box-shadow:0 2px 10px rgba(30,41,66,.05);
}
.panel h2{
  margin:0; font-size:14px; padding:12px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; background:var(--surface-2);
}
.panel h2 .tag{font-size:11px; font-weight:600; color:var(--ink-muted);}
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

table.dt{width:100%; border-collapse:collapse; font-size:13.5px;}
table.dt th{
  text-align:left; padding:8px 10px; font-size:11.5px; text-transform:uppercase;
  letter-spacing:.03em; color:var(--ink-muted); border-bottom:1px solid var(--line);
  cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0; background:var(--surface);
}
table.dt th.nosort{cursor:default;}
table.dt th .arrow{opacity:.5; font-size:10px;}
table.dt td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.dt tr.groupHeader td{
  background:var(--surface-2); padding:8px 10px; border-bottom:1px solid var(--line);
}
table.dt tr.groupHeader.repairHeader td{background:var(--danger-soft);}
table.dt tr.sectionHeader td{
  background:var(--accent-soft); padding:9px 10px; border-bottom:1px solid var(--line);
}
.ghRow{display:flex; align-items:center; gap:8px;}
.ghRow.nested{margin-left:22px;}
.ghRow .name{font-weight:700; font-size:13.5px;}
.ghRow.secRow .name{font-size:14.5px;}
.ghRow .count{color:var(--ink-muted); font-size:12px;}
.collapseBtn{
  background:none; border:none; cursor:pointer; font-size:12px; color:var(--ink-muted);
  width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
}
.collapsed-rows{display:none;}
tr.toolRow:hover{background:var(--surface-2);}
.desc-cell,.note-cell{color:var(--ink-muted); max-width:160px;}
.badge{
  display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700;
}
.badge-stock{background:var(--ok-soft); color:var(--ok);}
.badge-issued{background:var(--warn-soft); color:var(--warn);}
.badge-repair{background:var(--danger-soft); color:var(--danger);}
.rowActions{display:flex; gap:6px; align-items:center;}
.emptyMsg{padding:22px 14px; text-align:center; color:var(--ink-muted); font-size:13.5px;}
input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}

.selectionBar{
  position:sticky; bottom:60px; z-index:15; margin:0 14px;
  background:var(--ink); color:#fff; border-radius:var(--radius);
  padding:10px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.selectionBar b{margin-right:4px;}
.selectionBar .btn{background:rgba(255,255,255,.14); color:#fff; box-shadow:none;}
.selectionBar .btn-primary{background:var(--accent);}
.selectionBar .btn-danger{background:var(--danger);}

.tabbar{
  display:none; position:sticky; bottom:0; z-index:20;
  background:var(--glass); backdrop-filter:blur(14px); border-top:1px solid rgba(255,255,255,.6);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  align-items:stretch; gap:4px;
}
.tabbar button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:none; border:none; color:var(--ink-muted); font-size:10.5px; font-weight:600;
  border-radius:10px; padding:6px 2px; cursor:pointer; touch-action:manipulation;
}
.tabbar button .ic{font-size:18px;}
.tabbar button.active{color:var(--accent); background:var(--accent-soft);}
.tabbar button .tbdot{position:relative;}
.tabbar button .tbdot::after{
  content:""; position:absolute; top:-2px; right:-6px; width:7px; height:7px; border-radius:50%;
  background:var(--danger); display:none;
}
.tabbar button .tbdot.show::after{display:block;}

/* ---------- Modal ---------- */
.modalOverlay{
  position:fixed; inset:0; background:rgba(15,23,32,.42); z-index:50;
  display:flex; align-items:flex-end; justify-content:center; padding:0;
  backdrop-filter:blur(2px);
}
.modalBox{
  background:var(--surface); width:100%; max-width:480px; max-height:88dvh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.25);
}
@media (min-width:640px){
  .modalOverlay{align-items:center;}
  .modalBox{border-radius:18px; max-height:84dvh;}
}
.modalBox h3{margin:0 0 12px; font-size:16.5px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--ink-muted); margin-bottom:5px; font-weight:600;}
.field input,.field select,.field textarea{
  width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:10px 12px; background:var(--surface-2); color:var(--ink); height:44px;
}
.field textarea{height:70px; resize:vertical;}
.modalActions{display:flex; gap:8px; margin-top:16px;}
.modalActions .btn{flex:1;}
.modalClose{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:none; background:var(--surface-2); color:var(--ink-muted); cursor:pointer;
}
.modalBox{position:relative;}
.summaryList{
  background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px;
  font-size:13px; color:var(--ink-muted); max-height:120px; overflow-y:auto; margin-bottom:12px;
}
.summaryList div{padding:2px 0;}

/* QR tag card */
.qrTag{
  border:1.5px dashed #c3ccdc; border-radius:16px; padding:18px; text-align:center;
  background:linear-gradient(180deg,#fff,#f8fafd);
}
.qrTag canvas{border-radius:8px; background:#fff;}
.qrTag .qrTitle{font-weight:700; font-size:13px; margin:10px 0 2px;}
.qrTag .qrDate{font-size:11.5px; color:var(--ink-muted); margin-bottom:10px;}
.qrText{
  text-align:left; font-size:12px; white-space:pre-wrap; background:var(--surface-2);
  border-radius:var(--radius-sm); padding:10px; margin-top:12px; max-height:140px; overflow-y:auto;
}

.groupManageRow{
  display:flex; align-items:center; gap:6px; padding:8px 0; border-bottom:1px solid var(--line);
}
.groupManageRow input{flex:1; height:38px;}
.groupManageRow .btn{flex:none;}
.groupManageRow.nested{margin-left:20px; border-bottom:1px dashed var(--line);}
.groupManageRow.sectionRow{border-bottom:none; padding-top:12px;}
.groupManageRow.sectionRow input{font-weight:700;}
.gMoveSection{height:36px; border-radius:8px; border:1px solid var(--line); font-size:12px; flex:none; width:120px;}
.sectionManageBlock{margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid var(--line);}
.sectionManageBlock:last-of-type{border-bottom:none;}

.toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13.5px;
  z-index:80; box-shadow:var(--shadow); max-width:90vw; text-align:center;
}

/* ---------- Drag & drop ---------- */
.dragHandle{
  cursor:grab; touch-action:none; color:var(--ink-faint); font-size:16px; line-height:1;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  user-select:none; border-radius:6px;
}
.dragHandle:active{cursor:grabbing; background:var(--surface-2);}
tr.dragging{opacity:.35;}
#dragIndicator{
  position:fixed; height:3px; background:var(--accent); border-radius:2px; z-index:60;
  pointer-events:none; display:none; box-shadow:0 0 0 3px var(--accent-soft);
}

/* ---------- Color labels ---------- */
.colorBtn{
  width:24px; height:24px; border-radius:50%; border:2px solid #fff;
  box-shadow:0 0 0 1px var(--line); cursor:pointer; flex:none; padding:0;
}
.swatchRow{display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 14px;}
.swatch{width:42px; height:42px; border-radius:50%; cursor:pointer; border:3px solid transparent; padding:0;}
.swatch.selected{border-color:var(--ink);}
.swatch-none{background:#fff; border:2px dashed var(--ink-faint);}
.swatch-none.selected{border-color:var(--ink); border-style:solid;}

tr.toolRow.clr-red{background:#fdeaea;}
tr.toolRow.clr-orange{background:#fdf0e2;}
tr.toolRow.clr-yellow{background:#fdf7d9;}
tr.toolRow.clr-green{background:#e5f6ec;}
tr.toolRow.clr-blue{background:#e7f0fd;}
tr.toolRow.clr-purple{background:#f1e8fb;}
tr.toolRow.clr-gray{background:#ebeef2;}
table.dt tr.groupHeader.clr-red td{background:#fbd8d8;}
table.dt tr.groupHeader.clr-orange td{background:#fbe2c4;}
table.dt tr.groupHeader.clr-yellow td{background:#fbefb8;}
table.dt tr.groupHeader.clr-green td{background:#cdefdb;}
table.dt tr.groupHeader.clr-blue td{background:#d3e4fc;}
table.dt tr.groupHeader.clr-purple td{background:#e4d6f7;}
table.dt tr.groupHeader.clr-gray td{background:#dde1e8;}
table.dt tr.sectionHeader.clr-red td{background:#f7c6c6;}
table.dt tr.sectionHeader.clr-orange td{background:#f7d9a8;}
table.dt tr.sectionHeader.clr-yellow td{background:#f7e79c;}
table.dt tr.sectionHeader.clr-green td{background:#b9e8cc;}
table.dt tr.sectionHeader.clr-blue td{background:#bdd7fa;}
table.dt tr.sectionHeader.clr-purple td{background:#d8c3f2;}
table.dt tr.sectionHeader.clr-gray td{background:#cdd3dc;}

@media (max-width:860px){
  .content{grid-template-columns:1fr; padding:10px;}
  .panel[data-view="stock"].vhide,.panel[data-view="issued"].vhide{display:none;}
  .tabbar{display:flex;}
  .topbar .desktopOnly{display:none;}
  .selectionBar{bottom:64px;}
}
@media (min-width:861px){
  .mobileOnly{display:none;}
}

<body>
<div id="app">

  <div class="welcome" id="welcomeScreen">
    <div class="welcome-card">
      <h1>Toolkeeper 13</h1>
      <p>Офлайн-приложение для учёта выдачи и возврата. Данные хранятся в файле data.json или онлайн (GitHub).</p>
      <div class="welcome-actions">
        <button class="btn btn-primary" id="btnOpenWelcome">📂 Открыть базу</button>
        <button class="btn btn-outline" id="cloudSettingsBtn">⚙️ Настройки</button>
      </div>
      <div class="cloudWarn" id="modeHint" style="color:var(--ink-muted);text-align:center;"></div>
      <div class="draft-banner hidden" id="draftBanner">
        Найден несохранённый черновик от <span id="draftTime"></span>.
        <div class="row">
          <button class="btn btn-sm btn-primary" id="btnRestoreDraft">Восстановить</button>
          <button class="btn btn-sm btn-outline" id="btnDiscardDraft">Удалить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="hidden" id="mainApp">
    <header class="topbar">
      <span class="brand desktopOnly">🧰 Toolkeeper 13</span>
      <button class="btn btn-outline desktopOnly" id="btnOpen">📂 Открыть</button>
      <button class="btn btn-primary desktopOnly" id="btnSave">💾 Сохранить <span class="dot" id="saveDot"></span></button>
      <button class="btn btn-outline desktopOnly" id="btnAdd">✚ Добавить</button>
      <button class="btn btn-outline desktopOnly hidden" id="btnGroups">📁 Группы</button>
      <div class="spacer"></div>
      <label class="editSwitch">
        Редактирование
        <span class="switch" id="editSwitch"></span>
      </label>
      <button class="btn btn-outline" id="btnExit" title="Выйти">🚪<span class="desktopOnly"> Выйти</span></button>
    </header>

    <div class="counters">
      <span class="counter c-stock">В наличии: <b id="cntStock">0</b></span>
      <span class="counter c-issued">Выдано: <b id="cntIssued">0</b></span>
      <span class="counter c-repair">Отложено: <b id="cntRepair">0</b></span>
      <span class="counter" id="storageBadge">💾 Локально</span>
      <button type="button" class="counter hidden" id="btnCloudSettings" style="cursor:pointer;">⚙️ Настройки</button>
    </div>

    <div class="searchbar">
      <input type="text" id="searchInput" placeholder="Поиск по подзаголовкам…">
    </div>

    <div class="content">
      <section class="panel" data-view="stock" id="panelStock">
        <h2>В наличии <span class="tag">выдать / отложить</span></h2>
        <div class="tablewrap" id="stockTableWrap"></div>
      </section>
      <section class="panel" data-view="issued" id="panelIssued">
        <h2>Выдано <span class="tag">вернуть</span></h2>
        <div class="tablewrap" id="issuedTableWrap"></div>
      </section>
    </div>

    <div class="selectionBar hidden" id="selectionBar"></div>

    <nav class="tabbar" id="mobileTabbar">
      <button data-tab="stock" id="tabStock"><span class="ic">📦</span>В наличии</button>
      <button data-tab="issued" id="tabIssued"><span class="ic">📤</span>Выдано</button>
      <button id="tabAdd"><span class="ic">✚</span>Добавить</button>
      <button id="tabGroups" class="hidden"><span class="ic">📁</span>Группы</button>
      <button id="tabOpen"><span class="ic">📂</span>Открыть</button>
      <button id="tabSave"><span class="ic tbdot" id="tabSaveDot">💾</span>Сохранить</button>
    </nav>
  </div>

  <div class="modalOverlay hidden" id="modalOverlay">
    <div class="modalBox" id="modalBox"></div>
  </div>
  <div class="modalOverlay hidden" id="confirmOverlay" style="z-index:70;">
    <div class="modalBox" id="confirmBox" style="max-width:420px;"></div>
  </div>
  <div class="modalOverlay hidden" id="lockScreen" style="z-index:75;background:#eef1f4;">
    <div class="modalBox" style="max-width:360px;text-align:center;">
      <div style="font-size:40px;">🔒</div>
      <h3 style="margin:6px 0 12px;">Toolkeeper 13</h3>
      <div class="field"><input type="password" id="lockPw" placeholder="Пароль" autocomplete="current-password"></div>
      <div class="modalActions" style="justify-content:center;">
        <button class="btn btn-outline" id="lockCancel">Отмена</button>
        <button class="btn btn-primary" id="lockGo">Войти</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInputFallback" accept="application/json,.json" class="hidden">
  <div class="toast hidden" id="toast"></div>
  <div id="dragIndicator"></div>
</div>

<script>
/* ==================== QR CODE LIBRARY (MIT, Kazuhiko Arase) ==================== */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

async function ghGetFile(){
  var res = await fetch(ghUrl()+"?ref="+encodeURIComponent(CLOUD_CONFIG.branch), {headers: ghHeaders()});

async function ghPutFile(envelopeText, sha){

    content: utf8ToBase64(envelopeText),
    branch: CLOUD_CONFIG.branch
  };
  if(sha) body.sha = sha;
  var res = await fetch(ghUrl(), {
    method: "PUT",
    headers: Object.assign({"Content-Type":"application/json"}, ghHeaders()),
    body: JSON.stringify(body)

  if(!res.ok){
    if(res.status===409 || res.status===422){

/* ---------------- in-app confirm (native confirm() breaks text input in Electron) ---------------- */
function uiConfirm(msg, onYes, opts){
  opts = opts || {};
  var box = document.getElementById("confirmBox");
  var btns = opts.buttons || [{label:"Отмена", cls:"btn-outline"}, {label: opts.yes || "Да", cls:"btn-primary", fn:onYes}];

  var bar = box.querySelector(".modalActions");
  btns.forEach(function(b){

/* ---------------- entry password ---------------- */
function baseIsOpen(){ return !document.getElementById("mainApp").classList.contains("hidden"); }
async function hashPw(pw, saltB64){
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt: base64ToBytes(saltB64), iterations: 150000, hash:"SHA-256"}, km, 256);
  return bytesToBase64(new Uint8Array(bits));
}
async function setLockUI(){
  if(!cloudCryptoAvailable()){ toast("Web Crypto недоступен — пароль не поддерживается"); return; }
  var a = document.getElementById("cfgPw").value, b = document.getElementById("cfgPw2").value;
  if(a.length < 4){ toast("Пароль — не короче 4 символов"); return; }
  if(a !== b){ toast("Пароли не совпадают"); return; }
  var salt = bytesToBase64(crypto.getRandomValues(new Uint8Array(16)));
  state.lock = {v:1, salt: salt, hash: await hashPw(a, salt)};
  state.unlocked = true;
  markDirty(); closeModal();
  toast("Пароль установлен — сохраните базу 💾");
}
function showLockScreen(){
  var ls = document.getElementById("lockScreen");
  ls.classList.remove("hidden");
  var inp = document.getElementById("lockPw"); inp.value=""; setTimeout(function(){ inp.focus(); }, 50);
}
async function tryUnlock(){
  var inp = document.getElementById("lockPw");
  try{
    if(state.lock && await hashPw(inp.value, state.lock.salt) === state.lock.hash){
      state.unlocked = true;
      document.getElementById("lockScreen").classList.add("hidden");
      afterFileLoaded();
    } else { toast("Неверный пароль"); inp.select(); }
  }catch(e){ toast("Не удалось проверить пароль"); }
}
document.getElementById("lockGo").addEventListener("click", tryUnlock);
document.getElementById("lockPw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });

/* ---------------- derived helpers ---------------- */
function toolsByGroup(groupId, status){
  return state.tools.filter(function(t){ return t.group_id===groupId && t.status===status; });
}
function titleMatches(name){
  var term = state.search.trim().toLowerCase();
  if(!term) return true;
  return name.toLowerCase().indexOf(term) !== -1;
}
function sectionVisible(section){
  if(titleMatches(section.name)) return true;
  return state.groups.some(function(g){ return g.section_id===section.id && titleMatches(g.name); });
}
function groupVisible(section, group){
  if(titleMatches(section.name)) return true;
  return titleMatches(group.name);
}
function sortList(list, sortState){
  if(!sortState.col) return list;
  var col = sortState.col, mul = sortState.dir==="asc"?1:-1;
  return list.slice().sort(function(a,b){
    var av=(a[col]||"").toString().toLowerCase(), bv=(b[col]||"").toString().toLowerCase();
    if(av<bv) return -1*mul;
    if(av>bv) return 1*mul;
    return 0;
  });
}
function secKey(table, sectionId){ return table+":section:"+sectionId; }
function grpKey(table, groupId){ return table+":group:"+groupId; }

/* ---------------- rendering: counters ---------------- */
function renderCounters(){
  var stock=0, issued=0, repair=0;
  state.tools.forEach(function(t){
    if(t.status==="in_stock") stock++;
    else if(t.status==="issued") issued++;
    else if(t.status==="repair") repair++;
  });
  document.getElementById("cntStock").textContent = stock;
  document.getElementById("cntIssued").textContent = issued;
  document.getElementById("cntRepair").textContent = repair;
}

/* ---------------- rendering: sections + groups (shared by both tables) ---------------- */
function renderSectionsAndGroups(tableKey, status, colspan, rowRenderer){
  var html = "";
  var anyShown = false;
  var sortState = tableKey==="stock" ? state.sortStock : state.sortIssued;
  state.sections.forEach(function(sec){
    if(!sectionVisible(sec)) return;
    anyShown = true;
    var sKey = secKey(tableKey, sec.id);
    var secCollapsed = state.collapsed.has(sKey);
    var secClr = sec.color ? " clr-"+sec.color : "";
    var groupIdsInSec = state.groups.filter(function(g){ return g.section_id===sec.id; }).map(function(g){ return g.id; });
    var secToolCount = state.tools.filter(function(t){ return groupIdsInSec.indexOf(t.group_id)!==-1 && t.status===status; }).length;
    html += '<tbody>';
    html += '<tr class="sectionHeader'+secClr+'" data-status="'+status+'" data-section="'+sec.id+'">';
    html += '<td colspan="'+colspan+'"><div class="ghRow secRow">';
    if(state.editMode) html += '<span class="dragHandle" data-drag="section" data-id="'+sec.id+'">⠿</span>';
    html += '<input type="checkbox" class="sectionCheckbox" data-section="'+sec.id+'" data-status="'+status+'">';
    html += '<button class="collapseBtn" data-collapse="'+sKey+'">'+(secCollapsed?"▸":"▾")+'</button>';
    html += '<span class="name">'+escapeHtml(sec.name)+'</span><span class="count">('+secToolCount+')</span>';
    if(state.editMode) html += '<button class="colorBtn" data-action="color-section" data-id="'+sec.id+'" style="background:'+(colorHex(sec.color)||"#fff")+'"></button>';
    html += '</div></td></tr>';
    html += '</tbody>';

    if(secCollapsed) return;

    state.groups.filter(function(g){ return g.section_id===sec.id; }).forEach(function(g){
      if(!groupVisible(sec, g)) return;
      var gKey = grpKey(tableKey, g.id);
      var gCollapsed = state.collapsed.has(gKey);
      var rows = sortList(toolsByGroup(g.id, status), sortState);
      var gClr = g.color ? " clr-"+g.color : "";
      html += '<tbody>';
      html += '<tr class="groupHeader'+gClr+'" data-status="'+status+'" data-group="'+g.id+'" data-section="'+sec.id+'">';
      html += '<td colspan="'+colspan+'"><div class="ghRow nested">';
      if(state.editMode) html += '<span class="dragHandle" data-drag="group" data-id="'+g.id+'">⠿</span>';
      html += '<input type="checkbox" class="groupCheckbox" data-group="'+g.id+'" data-status="'+status+'">';
      html += '<button class="collapseBtn" data-collapse="'+gKey+'">'+(gCollapsed?"▸":"▾")+'</button>';
      html += '<span class="name">'+escapeHtml(g.name)+'</span><span class="count">('+rows.length+')</span>';
      if(state.editMode) html += '<button class="colorBtn" data-action="color-group" data-id="'+g.id+'" style="background:'+(colorHex(g.color)||"#fff")+'"></button>';
      html += '</div></td></tr>';
      if(!gCollapsed){
        rows.forEach(function(t, i){ html += rowRenderer(t, i, g); });
      }
      html += '</tbody>';
    });
  });
  return {html: html, anyShown: anyShown};
}

/* ---------------- header checkbox states (data-driven, works even when collapsed) ---------------- */
function updateHeaderCheckboxStates(){
  document.querySelectorAll(".groupCheckbox").forEach(function(cb){
    var ids;
    if(cb.hasAttribute("data-repair")){
      ids = state.tools.filter(function(t){ return t.status==="repair"; }).map(function(t){ return t.id; });
    } else {
      var gid = cb.getAttribute("data-group"), status = cb.getAttribute("data-status");
      ids = state.tools.filter(function(t){ return t.group_id===gid && t.status===status; }).map(function(t){ return t.id; });
    }
    if(ids.length===0){ cb.checked=false; cb.indeterminate=false; return; }
    var selCount = ids.filter(function(id){ return state.selected.has(id); }).length;
    cb.checked = selCount===ids.length;
    cb.indeterminate = selCount>0 && selCount<ids.length;
  });
  document.querySelectorAll(".sectionCheckbox").forEach(function(cb){
    var sid = cb.getAttribute("data-section"), status = cb.getAttribute("data-status");
    var groupIds = state.groups.filter(function(g){ return g.section_id===sid; }).map(function(g){ return g.id; });
    var ids = state.tools.filter(function(t){ return groupIds.indexOf(t.group_id)!==-1 && t.status===status; }).map(function(t){ return t.id; });
    if(ids.length===0){ cb.checked=false; cb.indeterminate=false; return; }
    var selCount = ids.filter(function(id){ return state.selected.has(id); }).length;
    cb.checked = selCount===ids.length;
    cb.indeterminate = selCount>0 && selCount<ids.length;
  });
}

function buildLotText(ids){
  var items = state.tools.filter(function(t){ return ids.indexOf(t.id)!==-1; });
  var lines = ["Позиции ("+items.length+" шт.), "+fmtDate(todayStr())];
  items.forEach(function(t, i){
    var line = (i+1)+". "+t.name;
    if(t.desc) line += " — "+t.desc;
    if(t.note) line += " (прим.: "+t.note+")";
    lines.push(line);
  });
  return lines.join("\n");
}
function openQRModal(ids){
  var text = buildLotText(ids);
  var html = '<h3>QR-код лота</h3>' +
    '<div class="qrTag">' +
    '<canvas id="qrCanvas"></canvas>' +
    '<div class="qrTitle">Позиции: '+ids.length+' шт.</div>' +
    '<div class="qrDate">'+fmtDate(todayStr())+'</div>' +
    '</div>' +
    '<div class="qrText" id="qrTextBlock">'+escapeHtml(text)+'</div>' +
    '<div class="modalActions">' +
    '<button class="btn btn-outline" data-action="qr-copy-text">📋 Копировать текст</button>' +
    '<button class="btn btn-primary" data-action="qr-download">⬇️ Скачать PNG</button>' +
    '</div>';
  openModal(html);
  try{
    var qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var cell = Math.max(4, Math.floor(220/count));
    var margin = cell*2;
    var size = count*cell + margin*2;
    var canvas = document.getElementById("qrCanvas");
    var dpr = window.devicePixelRatio || 1;
    canvas.width = size*dpr; canvas.height = size*dpr;
    canvas.style.width = size+"px"; canvas.style.height = size+"px";
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,size,size);
    ctx.fillStyle = "#111111";
    for(var r=0;r<count;r++){
      for(var c=0;c<count;c++){
        if(qr.isDark(r,c)) ctx.fillRect(margin + c*cell, margin + r*cell, cell, cell);
      }
    }
    canvas.dataset.ready = "1";
  }catch(err){
    document.querySelector(".qrTag").innerHTML = '<div style="color:var(--danger); font-size:13px; padding:20px;">Слишком много позиций для одного QR-кода. Попробуйте выделить меньше строк.</div>';
  }
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("Скопировано");
    }, function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); toast("Скопировано"); }
  catch(e){ toast("Не удалось скопировать — выделите текст вручную"); }
  document.body.removeChild(ta);
}

/* ---------------- drag & drop reorder ---------------- */
function moveTool(draggedId, targetGroupId, targetToolId, position){
  if(draggedId===targetToolId) return;
  var idx = state.tools.findIndex(function(x){ return x.id===draggedId; });
  if(idx===-1) return;
  var tool = state.tools[idx];
  state.tools.splice(idx,1);
  tool.group_id = targetGroupId;
  if(!targetToolId){
    var firstIdx = state.tools.findIndex(function(x){ return x.group_id===targetGroupId && x.status===tool.status; });
    if(firstIdx===-1) state.tools.push(tool);
    else state.tools.splice(firstIdx,0,tool);
  } else {
    var targetIdx = state.tools.findIndex(function(x){ return x.id===targetToolId; });
    if(targetIdx===-1){ state.tools.push(tool); }
    else { state.tools.splice(position==="after" ? targetIdx+1 : targetIdx, 0, tool); }
  }
}
function moveGroup(draggedGroupId, targetSectionId, targetGroupId, position){
  if(draggedGroupId===targetGroupId) return;
  var idx = state.groups.findIndex(function(x){ return x.id===draggedGroupId; });
  if(idx===-1) return;
  var group = state.groups[idx];
  state.groups.splice(idx,1);
  group.section_id = targetSectionId;
  if(!targetGroupId){
    var firstIdx = state.groups.findIndex(function(x){ return x.section_id===targetSectionId; });
    if(firstIdx===-1) state.groups.push(group);
    else state.groups.splice(firstIdx,0,group);
  } else {
    var targetIdx = state.groups.findIndex(function(x){ return x.id===targetGroupId; });
    if(targetIdx===-1){ state.groups.push(group); }
    else { state.groups.splice(position==="after" ? targetIdx+1 : targetIdx, 0, group); }
  }
}
function moveSection(draggedSectionId, targetSectionId, position){
  if(draggedSectionId===targetSectionId) return;
  var idx = state.sections.findIndex(function(x){ return x.id===draggedSectionId; });
  if(idx===-1) return;
  var sec = state.sections[idx];
  state.sections.splice(idx,1);
  var targetIdx = state.sections.findIndex(function(x){ return x.id===targetSectionId; });
  if(targetIdx===-1){ state.sections.push(sec); return; }
  state.sections.splice(position==="after" ? targetIdx+1 : targetIdx, 0, sec);
}

var dragState = null;
function showIndicator(rect, edge, wrapEl){
  var ind = document.getElementById("dragIndicator");
  var wrapRect = wrapEl.getBoundingClientRect();
  ind.style.left = wrapRect.left+"px";
  ind.style.width = wrapRect.width+"px";
  ind.style.top = (edge==="top" ? rect.top : rect.bottom)+"px";
  ind.style.display = "block";
}
function hideIndicator(){
  document.getElementById("dragIndicator").style.display = "none";
}
function clearDragTarget(){
  if(!dragState) return;
  dragState.targetGroupId = null; dragState.targetToolId = null; dragState.targetSectionId = null;
}
function onDragMove(e){
  if(!dragState) return;
  var el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el){ hideIndicator(); clearDragTarget(); return; }
  var wrapEl = el.closest(".tablewrap");
  if(!wrapEl || wrapEl.id !== dragState.sourceWrapId){ hideIndicator(); clearDragTarget(); return; }

  if(dragState.type==="row"){
    var row = el.closest("tr.toolRow");
    var gh = el.closest("tr.groupHeader");
    if(row && row.getAttribute("data-status")===dragState.sourceStatus && row.hasAttribute("data-group")){
      var rect = row.getBoundingClientRect();
      var before = e.clientY < (rect.top + rect.height/2);
      dragState.targetGroupId = row.getAttribute("data-group");
      dragState.targetToolId = row.getAttribute("data-id");
      dragState.targetPosition = before ? "before" : "after";
      showIndicator(rect, before ? "top" : "bottom", wrapEl);
    } else if(gh && gh.hasAttribute("data-group") && gh.getAttribute("data-status")===dragState.sourceStatus){
      var rect2 = gh.getBoundingClientRect();
      dragState.targetGroupId = gh.getAttribute("data-group");
      dragState.targetToolId = null;
      dragState.targetPosition = "start";
      showIndicator(rect2, "bottom", wrapEl);
    } else {
      hideIndicator(); clearDragTarget();
    }

  } else if(dragState.type==="group"){
    var gh2 = el.closest("tr.groupHeader");
    var sh = el.closest("tr.sectionHeader");
    if(gh2 && gh2.getAttribute("data-status")===dragState.sourceStatus && gh2.getAttribute("data-group")!==dragState.id){
      var rect3 = gh2.getBoundingClientRect();
      var before2 = e.clientY < (rect3.top + rect3.height/2);
      dragState.targetSectionId = gh2.getAttribute("data-section");
      dragState.targetGroupId = gh2.getAttribute("data-group");
      dragState.targetPosition = before2 ? "before" : "after";
      showIndicator(rect3, before2 ? "top" : "bottom", wrapEl);
    } else if(sh && sh.getAttribute("data-status")===dragState.sourceStatus){
      var rect4 = sh.getBoundingClientRect();
      dragState.targetSectionId = sh.getAttribute("data-section");
      dragState.targetGroupId = null;
      dragState.targetPosition = "start";
      showIndicator(rect4, "bottom", wrapEl);
    } else {
      hideIndicator(); clearDragTarget();
    }

  } else if(dragState.type==="section"){
    var sh2 = el.closest("tr.sectionHeader");
    if(sh2 && sh2.getAttribute("data-status")===dragState.sourceStatus && sh2.getAttribute("data-section")!==dragState.id){
      var rect5 = sh2.getBoundingClientRect();
      var before3 = e.clientY < (rect5.top + rect5.height/2);
      dragState.targetSectionId = sh2.getAttribute("data-section");
      dragState.targetPosition = before3 ? "before" : "after";
      showIndicator(rect5, before3 ? "top" : "bottom", wrapEl);
    } else {
      hideIndicator(); clearDragTarget();
    }
  }
}
function onDragEnd(e){
  if(!dragState) return;
  var handle = dragState.handleEl;
  handle.removeEventListener("pointermove", onDragMove);
  handle.removeEventListener("pointerup", onDragEnd);
  handle.removeEventListener("pointercancel", onDragEnd);
  document.querySelectorAll("tr.dragging").forEach(function(r){ r.classList.remove("dragging"); });
  hideIndicator();
  var applied = false;
  if(dragState.type==="row" && dragState.targetGroupId){
    moveTool(dragState.id, dragState.targetGroupId, dragState.targetToolId, dragState.targetPosition);
    if(dragState.sourceWrapId==="stockTableWrap") state.sortStock = {col:null, dir:"asc"};
    else state.sortIssued = {col:null, dir:"asc"};
    applied = true;
  } else if(dragState.type==="group" && dragState.targetSectionId){
    moveGroup(dragState.id, dragState.targetSectionId, dragState.targetGroupId, dragState.targetPosition);
    applied = true;
  } else if(dragState.type==="section" && dragState.targetSectionId){
    moveSection(dragState.id, dragState.targetSectionId, dragState.targetPosition);
    applied = true;
  }
  dragState = null;
  if(applied){ markDirty(); renderAll(); }
}
document.addEventListener("pointerdown", function(e){
  var handle = e.target.closest(".dragHandle");
  if(!handle) return;
  e.preventDefault();
  var type = handle.getAttribute("data-drag");
  var id = handle.getAttribute("data-id");
  var wrapEl = handle.closest(".tablewrap");
  var sourceRow = handle.closest("tr");
  dragState = {
    type: type, id: id,
    sourceWrapId: wrapEl ? wrapEl.id : null,
    sourceStatus: sourceRow ? sourceRow.getAttribute("data-status") : null,
    handleEl: handle,
    targetGroupId: null, targetToolId: null, targetSectionId: null, targetPosition: null
  };
  sourceRow.classList.add("dragging");
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  handle.addEventListener("pointermove", onDragMove);
  handle.addEventListener("pointerup", onDragEnd);
  handle.addEventListener("pointercancel", onDragEnd);
});

/* ---------------- selection helpers ---------------- */
function syncCheckboxesFromState(){
  document.querySelectorAll(".rowCheckbox").forEach(function(cb){
    cb.checked = state.selected.has(cb.getAttribute("data-id"));
  });
  updateHeaderCheckboxStates();
  renderSelectionBar();
}
function toggleRow(id){
  if(state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
  syncCheckboxesFromState();
}
function toggleGroupSelection(groupId, status){
  var ids = state.tools.filter(function(t){ return t.group_id===groupId && t.status===status; }).map(function(t){ return t.id; });
  var allSelected = ids.length>0 && ids.every(function(id){ return state.selected.has(id); });
  ids.forEach(function(id){ if(allSelected) state.selected.delete(id); else state.selected.add(id); });
  syncCheckboxesFromState();
}
function toggleSectionSelection(sectionId, status){
  var groupIds = state.groups.filter(function(g){ return g.section_id===sectionId; }).map(function(g){ return g.id; });
  var ids = state.tools.filter(function(t){ return groupIds.indexOf(t.group_id)!==-1 && t.status===status; }).map(function(t){ return t.id; });
  var allSelected = ids.length>0 && ids.every(function(id){ return state.selected.has(id); });
  ids.forEach(function(id){ if(allSelected) state.selected.delete(id); else state.selected.add(id); });
  syncCheckboxesFromState();
}
function toggleRepairSelection(){
  var ids = state.tools.filter(function(t){ return t.status==="repair"; }).map(function(t){ return t.id; });
  var allSelected = ids.length>0 && ids.every(function(id){ return state.selected.has(id); });
  ids.forEach(function(id){ if(allSelected) state.selected.delete(id); else state.selected.add(id); });
  syncCheckboxesFromState();
}
function clearSelection(){
  state.selected.clear();
  syncCheckboxesFromState();
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el){
    var collapseBtn = e.target.closest("[data-collapse]");
    if(collapseBtn){
      var key = collapseBtn.getAttribute("data-collapse");
      if(state.collapsed.has(key)) state.collapsed.delete(key); else state.collapsed.add(key);
      renderStockTable(); renderIssuedTable(); updateHeaderCheckboxStates();
      return;
    }
    return;
  }
  var action = el.getAttribute("data-action");
  switch(action){
    case "close-modal": closeModal(); break;
    case "save-new-tool": saveNewTool(); break;
    case "save-edit-tool": saveEditTool(el.getAttribute("data-id")); break;
    case "edit-tool": openEditToolModal(el.getAttribute("data-id")); break;
    case "delete-tool": deleteTool(el.getAttribute("data-id")); break;
    case "issue-one": openIssueModal([el.getAttribute("data-id")]); break;
    case "return-one": openReturnModal([el.getAttribute("data-id")]); break;
    case "unrepair-one": unrepairOne(el.getAttribute("data-id")); break;
    case "confirm-issue": confirmIssue(el.getAttribute("data-ids").split(",")); break;
    case "confirm-return": confirmReturn(el.getAttribute("data-ids").split(",")); break;
    case "bulk-issue": openIssueModal(Array.from(state.selected)); break;
    case "bulk-return": openReturnModal(Array.from(state.selected)); break;
    case "bulk-repair": bulkRepair(Array.from(state.selected)); break;
    case "bulk-unrepair": bulkUnrepair(Array.from(state.selected)); break;
    case "bulk-qr": openQRModal(Array.from(state.selected)); break;
    case "bulk-copy": copyText(buildLotText(Array.from(state.selected))); break;
    case "bulk-clear": clearSelection(); break;
    case "add-group": addGroup(); break;
    case "delete-group": deleteGroup(el.getAttribute("data-id")); break;
    case "add-section": addSection(); break;
    case "delete-section": deleteSection(el.getAttribute("data-id")); break;
    case "add-group-to": addGroupTo(el.getAttribute("data-section")); break;
    case "color-tool": openColorModal("tool", el.getAttribute("data-id")); break;
    case "color-group": openColorModal("group", el.getAttribute("data-id")); break;
    case "color-section": openColorModal("section", el.getAttribute("data-id")); break;
    case "conflict-load-remote": conflictLoadRemote(); break;
    case "conflict-force-push": conflictForcePush(); break;
    case "gen-aes-key": generateAesKeyUI(); break;
    case "copy-aes-key": {
      var kt = document.getElementById("cfgKey");
      if(kt && kt.value.trim()) copyText(kt.value.trim()); else toast("Ключ пуст");
      break;
    }
    case "save-cloud-cfg": saveCloudSettingsUI(); break;
    case "set-lock": setLockUI(); break;
    case "set-mode": if(!el.disabled){ setMode(el.getAttribute("data-mode")); document.querySelectorAll('#modalBox [data-action="set-mode"]').forEach(function(b){ b.classList.toggle("active", b===el); }); } break;
    case "new-db": {
      var mk = function(){ closeModal(); newDatabase(); };
      if(baseIsOpen() && state.dirty) uiConfirm("Есть несохранённые изменения. Всё равно создать новую базу?", mk); else uiConfirm("Создать новую пустую базу?", mk);
      break;
    }
    case "remove-lock": uiConfirm("Убрать пароль входа? После сохранения базу можно будет открыть без пароля.", function(){ state.lock=null; markDirty(); closeModal(); toast("Пароль убран — сохраните базу"); }); break;
    case "clear-cloud-cfg": {
      uiConfirm("Удалить репозиторий, токен и ключ с этого устройства?", function(){
        CLOUD_CONFIG.repo=""; CLOUD_CONFIG.token=""; CLOUD_CONFIG.aesKeyBase64=""; CLOUD_CONFIG.branch="main"; CLOUD_CONFIG.filePath="data.json.enc";
        try{ localStorage.removeItem(CLOUD_KEY); }catch(e){}
        closeModal(); toast("Настройки облака удалены");
      });
      break;
    }
    case "qr-copy-text": copyText(document.getElementById("qrTextBlock").textContent); break;
    case "qr-download": {
      var canvas = document.getElementById("qrCanvas");
      if(canvas && canvas.dataset.ready){
        var a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = "qr-lot.png";
        document.body.appendChild(a); a.click(); a.remove();
      }
      break;
    }
  }
});
document.addEventListener("change", function(e){
  if(e.target.classList.contains("rowCheckbox")){
    toggleRow(e.target.getAttribute("data-id"));
  } else if(e.target.classList.contains("groupCheckbox")){
    if(e.target.hasAttribute("data-repair")) toggleRepairSelection();
    else toggleGroupSelection(e.target.getAttribute("data-group"), e.target.getAttribute("data-status"));
  } else if(e.target.classList.contains("sectionCheckbox")){
    toggleSectionSelection(e.target.getAttribute("data-section"), e.target.getAttribute("data-status"));
  }
});
document.addEventListener("click", function(e){
  var th = e.target.closest("th[data-sort]");
  if(!th) return;
  var col = th.getAttribute("data-sort");
  var table = th.getAttribute("data-table");
  var s = table==="stock" ? state.sortStock : state.sortIssued;
  if(s.col===col){ s.dir = s.dir==="asc"?"desc":"asc"; } else { s.col=col; s.dir="asc"; }
  if(table==="stock") renderStockTable(); else renderIssuedTable();
  updateHeaderCheckboxStates();
  document.querySelectorAll("input.rowCheckbox").forEach(function(cb){
    cb.checked = state.selected.has(cb.getAttribute("data-id"));
  });
});
var overlayDownTarget = null;
document.getElementById("modalOverlay").addEventListener("pointerdown", function(e){
  overlayDownTarget = e.target;
});
document.getElementById("modalOverlay").addEventListener("click", function(e){
  // close only if the press AND the release both happened on the dark backdrop
  // (selecting text and releasing outside the window must not close it)
  var startedOnBackdrop = (overlayDownTarget === null) || (overlayDownTarget.id === "modalOverlay");
  overlayDownTarget = null;
  if(e.target.id==="modalOverlay" && startedOnBackdrop) closeModal();
});
document.getElementById("searchInput").addEventListener("input", function(e){
  state.search = e.target.value;
  renderStockTable(); renderIssuedTable(); updateHeaderCheckboxStates();
});
document.getElementById("editSwitch").addEventListener("click", function(){
  state.editMode = !state.editMode;
  this.classList.toggle("on", state.editMode);
  document.getElementById("btnGroups").classList.toggle("hidden", !state.editMode);
  document.getElementById("tabGroups").classList.toggle("hidden", !state.editMode);
  document.getElementById("btnCloudSettings").classList.toggle("hidden", !state.editMode);

/* storage mode toggle (welcome screen) */
var MODE_KEY = "toolkeeper13_last_mode";
function setMode(m){
  if(m==="cloud" && !cloudCryptoAvailable()) m="local";
  state.storageMode = m;
  if(m==="cloud") state.cloudSHA = state.cloudSHA || null;
  rememberMode(); updateStorageBadge(); updateWelcomeMode();
}
function rememberMode(){ try{ localStorage.setItem(MODE_KEY, state.storageMode); }catch(e){} }
function updateWelcomeMode(){
  var cloud = state.storageMode==="cloud";
  document.getElementById("btnOpenWelcome").textContent = cloud ? "☁️ Открыть онлайн-базу" : "📂 Открыть базу (data.json)";
  document.getElementById("modeHint").textContent = cloud ? "Режим: онлайн. Сменить или создать новую базу — в ⚙️ Настройках." : "Режим: локально. Сменить или создать новую базу — в ⚙️ Настройках.";
}
(function initStorageMode(){
  var m = "local"; try{ m = localStorage.getItem(MODE_KEY) || "local"; }catch(e){}
  if(m==="cloud" && !cloudCryptoAvailable()) m="local";
  state.storageMode = m;
  updateWelcomeMode();
  document.getElementById("cloudSettingsBtn").addEventListener("click", openCloudInfoModal);
})();

/* ---------------- draft restore on load ---------------- */
(function initDraftBanner(){
  try{
    var raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    var draft = JSON.parse(raw);
    if(!draft || !draft.ts) return;
    document.getElementById("draftBanner").classList.remove("hidden");
    document.getElementById("draftTime").textContent = new Date(draft.ts).toLocaleString("ru-RU");
    document.getElementById("btnRestoreDraft").addEventListener("click", function(){
      loadDataFromObject({sections: draft.sections, groups: draft.groups, tools: draft.tools, lock: draft.lock});
      state.fileHandle = null;
      state.fileMode = ("showSaveFilePicker" in window) ? "fsapi-new" : "fallback";
      state.dirty = true;
      afterFileLoaded();
      toast("Черновик восстановлен — не забудьте сохранить");
    });
    document.getElementById("btnDiscardDraft").addEventListener("click", function(){
      clearDraft();
      document.getElementById("draftBanner").classList.add("hidden");
    });
  }catch(e){}
})();

};
